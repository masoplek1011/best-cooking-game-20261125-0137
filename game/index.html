<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hearthrow Hustle — a one-shift cooking game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #25303e;
    min-height: 100%;
    font-family: system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    box-sizing: border-box;
  }
  canvas {
    width: min(1280px, 96vw);
    height: auto;
    aspect-ratio: 1280 / 720;
    background: #2e3a4a;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    cursor: pointer;
  }
  p {
    margin: 0;
    color: #9fb0c0;
    font-size: 13px;
    text-align: center;
  }
  p b { color: #f5efe2; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<p><b>Hearthrow Hustle</b> — read the board, chop, cook, plate, serve. Keys 1–9 grab ingredients, hold SPACE (or the mouse) on the board to chop, R restarts, M mutes.</p>
<script type="module">
  import { startGame } from './src/main.js';
  const canvas = document.getElementById('game');
  startGame(canvas, canvas.getContext('2d'));
</script>
</body>
</html>
